repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/AleksaC/hadolint-py
    rev: v2.15.1
    hooks:
      - id: hadolint

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.15
    hooks:
      - id: uv-lock

  - repo: local
    hooks:
      # Needs the network, so it runs only when the lockfile changes.
      # Skip it alone during an outage: SKIP=pip-audit git commit
      - id: pip-audit
        name: pip-audit
        entry: uv run pip-audit --skip-editable
        language: system
        files: ^uv\.lock$
        pass_filenames: false
      - id: check
        name: ./check --offline
        entry: ./check --offline
        language: system
        pass_filenames: false
        always_run: true
