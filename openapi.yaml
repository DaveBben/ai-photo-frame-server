openapi: 3.1.0
info:
  title: local-shazam
  description: Image transformation server that transforms images to match a song's visual aesthetic
  version: 0.1.0

servers:
  - url: http://localhost:8000
    description: Local development server

paths:
  /health:
    get:
      summary: Health check
      description: Returns server health status
      operationId: health_check
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /images:
    post:
      summary: Restyle image
      description: |
        Restyle the photo sent with the request to match a song's visual aesthetic.
        The server keeps the photo in memory and writes no copy of it or of the result.
        1. The vision model captions the photo
        2. Lookup/fetch visual aesthetic for the song (cached in SQLite)
        3. The vision model writes an edit prompt from the caption and the aesthetic
        4. The Flux server executes the image transformation
      operationId: transform_image
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - song_title
                - song_artists
              properties:
                file:
                  type: string
                  format: binary
                  description: Photo file (JPEG, PNG), at most 10 MB
                song_title:
                  type: string
                  description: Name of the song
                song_artists:
                  type: string
                  description: Artist name(s)
      responses:
        "200":
          description: Transformed 800x480 image
          content:
            image/png:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid image file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: File larger than 10 MB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: The vision model or the Flux server failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /aesthetic:
    get:
      summary: Get song aesthetic
      description: |
        Get the visual aesthetic description for a song. Uses a cache to avoid
        repeated API calls. On cache miss, searches the web for visual aesthetic
        information about the song and artist.
      operationId: get_aesthetic
      parameters:
        - name: song_title
          in: query
          required: true
          description: Name of the song
          schema:
            type: string
        - name: artist
          in: query
          required: true
          description: Artist name
          schema:
            type: string
      responses:
        "200":
          description: Aesthetic description returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AestheticResponse"

components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: healthy

    ErrorResponse:
      type: object
      required:
        - detail
      properties:
        detail:
          type: string
          description: Error message
          example: Invalid image file

    AestheticResponse:
      type: object
      required:
        - aesthetic
      properties:
        aesthetic:
          type: string
          description: Visual aesthetic description for the song
          example: Vibrant neon colors with dark backgrounds, Y2K fashion influences...
