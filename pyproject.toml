[project]
name = "local-shazam"
dynamic = ["version"]
description = "Image transformation server"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "anyio>=4.0",
    "openai>=1.0",
    "pillow>=10.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.18",
    "mlx-vlm>=0.7.0 ; sys_platform == 'darwin'",
    "mflux>=0.19.1 ; sys_platform == 'darwin'",
]

[dependency-groups]
dev = [
    "hypothesis>=6.120",
    "import-linter>=2.15",
    "mutmut>=3.8.0",
    "mypy>=1.13",
    "pip-audit>=2.7",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.5",
    "respx>=0.22",
    "ruff>=0.8",
    "vulture>=2.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
local-shazam-server = "local_shazam.server:main"
local-shazam-flux = "local_shazam.flux_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/local_shazam"]

[tool.hatch.version]
path = "src/local_shazam/__init__.py"

[tool.ruff]
target-version = "py313"
src = ["src"]
extend-exclude = ["vulture_whitelist.py"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "SIM", "RUF", "PTH", "PERF", "S", "ASYNC",
    "A", "C4", "DTZ", "PIE", "RET", "TCH", "ARG", "FURB",
]
ignore = ["E501", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "ARG001"]

[tool.ruff.lint.isort]
known-first-party = ["local_shazam"]

[tool.mypy]
mypy_path = "src"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# mflux has no type information, and does not install on Linux.
module = ["mflux.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-ra -q --strict-markers -m 'not e2e and not macmini'"
markers = [
    "slow",
    "integration",
    "e2e: starts the real server process and calls it over HTTP",
    "macmini: calls the real servers on the Mac mini over the network",
]
filterwarnings = ["error"]
xfail_strict = true

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.importlinter]
root_package = "local_shazam"
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "ADR item 1: api imports no model client, store, config or server"
type = "forbidden"
source_modules = ["local_shazam.api"]
forbidden_modules = [
    "local_shazam.openai_client",
    "local_shazam.flux2_client",
    "local_shazam.image_store",
    "local_shazam.aesthetic_cache",
    "local_shazam.config",
    "local_shazam.server",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "ADR item 2: pipeline imports no api, server or config"
type = "forbidden"
source_modules = ["local_shazam.pipeline"]
forbidden_modules = ["local_shazam.api", "local_shazam.server", "local_shazam.config"]

[[tool.importlinter.contracts]]
name = "ADR item 4: model clients and stores import no api, pipeline, server, config or each other"
type = "layers"
layers = [
    "local_shazam.api : local_shazam.pipeline : local_shazam.server : local_shazam.config",
    "local_shazam.openai_client | local_shazam.flux2_client | local_shazam.image_store | local_shazam.aesthetic_cache",
]

[[tool.importlinter.contracts]]
name = "ADR item 5: only server imports config"
type = "protected"
protected_modules = ["local_shazam.config"]
allowed_importers = ["local_shazam.server"]

[[tool.importlinter.contracts]]
name = "The Flux server imports nothing from the API server"
type = "forbidden"
source_modules = ["local_shazam.flux_server"]
forbidden_modules = ["local_shazam.api", "local_shazam.pipeline", "local_shazam.server"]

[[tool.importlinter.contracts]]
name = "The API server imports nothing from the Flux server"
type = "forbidden"
source_modules = ["local_shazam.api", "local_shazam.pipeline"]
forbidden_modules = ["local_shazam.flux_server"]

[tool.vulture]
paths = ["src", "vulture_whitelist.py"]

[tool.mutmut]
source_paths = ["src/"]
# tests/test_deploy.py and tests/test_deploy_plist.py read these from the mutants/ copy.
also_copy = ["scripts/", "deploy/"]

[tool.uv]
# mflux 0.19.1 asks for mlx[cuda13]<0.32 on Linux, which uv's lock cannot reconcile with
# mlx-vlm's mlx>=0.32.2 even though both are macOS-only here. Neither installs on Linux.
override-dependencies = ["mlx>=0.32.2,<0.33.0; sys_platform == 'darwin'"]
